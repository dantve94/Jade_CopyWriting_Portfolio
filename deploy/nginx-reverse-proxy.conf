# Example nginx server block for an existing nginx reverse proxy on your network.
# Forwards http://portfolio.home to the portfolio container on port 8080.
#
# 1. Replace 192.168.1.50 with the IP of the computer running `docker compose up`
#    (use 127.0.0.1 if nginx runs on that same computer).
# 2. Replace portfolio.home with the name you set up in your router / Pi-hole / hosts file.
# 3. Copy into /etc/nginx/conf.d/ (or sites-enabled/) and run: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name portfolio.home;

    location / {
        proxy_pass         http://192.168.1.50:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
